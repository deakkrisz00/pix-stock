<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/pix_icon_192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Pix Készletkezelő</title>
</head>
<body>
  <header class="app-header">
    <h1>Pix Készletkezelő</h1>
    <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
  </header>

  <div class="app-body">
    <nav class="sidebar" id="sidebar">
      <ul>
        <li data-role="admin" data-section="inventory-section" class="nav-item active">📦 Készlet</li>
        <li data-role="admin" data-section="pens-section"      class="nav-item">🖊️ Tollak</li>
        <li data-role="worker" data-section="inventory-section" class="nav-item">📦 Készlet</li>
      </ul>
    </nav>

    <main class="content" id="main-content">

      <!-- Készlet szekció -->
      <section id="inventory-section" class="section">
        <div class="section-header">
          <h2>Készlet Lista</h2>
          <div class="section-actions">
            <button id="add-item" class="cta-button">+ Új tétel</button>
            <button id="import-inventory-btn" class="cta-button secondary">📥 Excel import</button>
            <input type="file" id="import-inventory-file" accept=".xlsx,.xls,.csv" hidden />
          </div>
        </div>
        <table class="glass-table" id="inventory-table">
          <thead>
            <tr>
              <th>Toll neve</th>
              <th>Központi</th>
              <th>Bazár</th>
              <th>Fenti</th>
              <th>Összesen</th>
              <th>Akció</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <!-- Tollak szekció -->
      <section id="pens-section" class="section hidden">
        <div class="section-header">
          <h2>Tollak kezelése</h2>
          <div class="section-actions">
            <button id="add-pen" class="cta-button">+ Új toll</button>
            <button id="import-pens-btn" class="cta-button secondary">📥 Excel import</button>
            <input type="file" id="import-pens-file" accept=".xlsx,.xls,.csv" hidden />
          </div>
        </div>
        <table class="glass-table" id="pens-table">
          <thead>
            <tr>
              <th>Toll neve</th>
              <th>Típus</th>
              <th>Akció</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

    </main>
  </div>

  <!-- Excel import modal -->
  <div id="import-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Excel Importálás</h3>
        <button id="modal-close" class="modal-close-btn" aria-label="Bezárás">✕</button>
      </div>

      <div class="modal-body">
        <!-- Lapválasztó -->
        <div class="form-row" id="sheet-selector-row">
          <label for="sheet-select">Excel lap (sheet):</label>
          <select id="sheet-select" class="styled-select"></select>
        </div>

        <!-- Oszlop-leképezés -->
        <div class="form-row" id="col-map-row">
          <label>Oszlopok leképezése:</label>
          <div id="col-map-fields"></div>
        </div>

        <!-- Előnézet -->
        <div id="preview-area">
          <p class="preview-label">Előnézet (első 5 sor):</p>
          <div class="preview-scroll">
            <table class="glass-table" id="preview-table">
              <thead id="preview-thead"></thead>
              <tbody id="preview-tbody"></tbody>
            </table>
          </div>
          <p id="preview-count" class="preview-count"></p>
        </div>
      </div>

      <div class="modal-footer">
        <button id="modal-cancel" class="cta-button secondary">Mégse</button>
        <button id="modal-import" class="cta-button">✅ Importálás</button>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <p>© 2026 Pix Készletkezelő – verzió 1.0</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
